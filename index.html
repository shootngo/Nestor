<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nestor</title>
    <meta name="description" content="Private household notebook — calendar and bills." />
    <meta name="theme-color" content="#7D8B74" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nestor" />
    <meta name="application-name" content="Nestor" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="splash" class="splash" aria-hidden="true">
      <img src="assets/splash.jpg" alt="" />
      <div class="splash-copy">
        <h1>Nestor</h1>
        <p>Home, held gently</p>
      </div>
    </div>

    <div id="auth-screen" class="auth-screen"></div>

    <div id="app-shell" class="app-shell hidden">
      <header class="topbar">
        <img class="mark" src="icon-192.png" alt="" />
        <div class="brand">
          <h1>Nestor</h1>
          <p id="who"></p>
        </div>
      </header>
      <main id="view" class="view"></main>
      <nav id="tabbar" class="tabbar" aria-label="Primary">
        <a class="tab is-active" data-tab="calendar" href="#/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="5" width="18" height="16" rx="3"></rect>
            <path d="M3 10h18M8 3v4M16 3v4"></path>
          </svg>
          Calendar
        </a>
        <a class="tab" data-tab="bills" href="#/bills">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 4h12v16H6z"></path>
            <path d="M9 8h6M9 12h6M9 16h4"></path>
          </svg>
          Bills
        </a>
        <a class="tab" data-tab="more" href="#/more">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="1"></circle>
            <circle cx="12" cy="6" r="1"></circle>
            <circle cx="12" cy="18" r="1"></circle>
          </svg>
          More
        </a>
      </nav>
    </div>
    <div id="toast" class="toast" role="status"></div>

    <script src="js/config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
